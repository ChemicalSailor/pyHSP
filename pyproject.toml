[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyhsp"
dynamic = ["version"]
description = 'Hansen Solubility Parameter (HSP) fitting.'
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["Hansen Solubility", "Chemistry", "Science", "scikit-learn"]
authors = [
  { name = "Tom Fletcher" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",  
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "numpy>=2.3",
  "pandas>=3",
  "scikit-learn>=1.8",
  "scipy>=1.18",
]

# [project.urls]
# Documentation = "https://github.com/Tom/pyhsp#readme"
# Issues = "https://github.com/Tom/pyhsp/issues"
# Source = "https://github.com/Tom/pyhsp"

[tool.hatch.version]
path = "src/pyhsp/__init__.py"

[tool.hatch.envs.default]
dependencies = [
  "pytest",
  "pytest-cov",
  "pytest-check",
  "pytest-mock",
  "jupyterlab",
  "matplotlib",
  "seaborn",
  "hspipy",
  "pydoclint",
]

[tool.hatch.envs.hatch-test]
installer = "uv"
dependencies = [
  "pytest-cov>=7.1",
  "pytest-check>=3.1",
  "pytest-mock>=3.17",
]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.12", "3.13", "3.14", "3.15"]
deps = ["latest"]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.12"]
deps = ["minimum"]

[tool.hatch.envs.hatch-test.overrides]
matrix.deps.env-vars = [
  { key = "UV_RESOLUTION", value = "lowest-direct", if = ["minimum"] },
]


[tool.coverage.run]
source_pkgs = ["pyhsp", "tests"]
branch = true
parallel = true
omit = [
  "src/pyhsp/__about__.py",
]

[tool.coverage.paths]
pyhsp = ["src/pyhsp", "*/pyhsp/src/pyhsp"]
tests = ["tests", "*/pyhsp/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
